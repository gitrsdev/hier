<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <style>
            * {
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }
            /* body {
                min-width: 1500px;
            } */
            #container {
                margin: 0px 0px 0px 0px;
                padding: 0px 0px 0px 0px;
            }
            #div_bom_frame {
                border : solid 1px rgb(172, 172, 172);
                padding: 10px 0px 10px 10px;
                white-space: nowrap;
                #select_bom_file {
                    width: 300px;
                }
                #button_bom_save {
                    margin: 0px 30px 0px 0px;
                }
            }
            #div_search_frame {
                border : solid 1px rgb(172, 172, 172);
                margin: -1px 0px 0px 0px;
                padding: 10px 0px 10px 10px;
                white-space: nowrap;
                #select_search_target {
                    width: 100px;
                }
                #text_search_word {
                    width: 300px;
                }
                #label_search_hit_count {
                    margin-left: 10px;
                    margin-right: 10px;
                }
            }
            #div_bom_setting {
                border : solid 1px rgb(172, 172, 172);
                margin: -1px 0px 0px 0px;
                padding: 10px 0px 10px 10px;
                display: flex;
                gap: 10px;
            }
            #table {
                font-size: 10px;
            }
            #bom_top {
                border : solid 1px rgb(172, 172, 172);
                height: calc(100vh - 240px);
                overflow-y: scroll;
                overflow-x: hidden;
                user-select: none;
            }
            /* -------------------------------------------- */
            /* hier                                         */
            /* -------------------------------------------- */
            .hier {
                color: black;
                background-color: white;
                border : solid 1px black;
                margin: 5px 5px 5px 30px;
            }
            .hier_top {
                margin-left: 10px;
            }
            .hier:has(.search_hit) {
                color: red;
            }
            .hide > .hier {
                display: none;
            }
            .hide_kikou {
                display: none;
            }
            .hide_number {
                display: none;
            }
            /* -------------------------------------------- */
            /* hier_info                                    */
            /* -------------------------------------------- */
            .hier_info {
                margin: 0px 5px 0px 0px;
                padding: 0px 0px 0px 5px;
                display:flex;
                white-space: nowrap;
                /* gap: 10px; */
            }
            /* -------------------------------------------- */
            /* op_cl                                        */
            /* -------------------------------------------- */
            .op_cl {
                background-color: rgb(185, 183, 183);
                margin: 5px 5px 5px 0px;
                padding: 5px 10px 5px 10px;
                font-size: 10px;
            }
            .hide > .hier_info > .op_cl {
                background-color: aqua;
            }
            .hier:not(:has(> .hier)) .op_cl {
                /* background-color: rgb(197, 229, 255); */
                /* pointer-events: none; */
                    background-color: white;
            }
            /* -------------------------------------------- */
            /* yoso                                         */
            /* -------------------------------------------- */
            .yoso {
                padding: 3px 5px 3px 5px;
            }
            /* -------------------------------------------- */
            /* other                                        */
            /* -------------------------------------------- */
            .search_hit {
                border: solid 2px red;
                color: red;
            }
            .off {
                display: none;
            }
            .hier_select {
                background-color: rgb(255, 255, 180);
            }
        </style>
        <div id="container">
            <div id="div_bom_frame">
                <button id="button_bom_dir">ディレクトリ選択</button>
                <button id="button_bom_save">保存</button>
                <label>BOM ファイル名：</label>
                <select id="select_bom_file">
                    <option value="" disabled selected>ファイルを選択してください</option>
                </select>
                <button id="bom_show">表示</button>
                <input id="file" type="file"></input>
            </div>
            <div id="div_search_frame">
                <select id="select_search_target">
                </select>
                <input id="text_search_word" type="text"></input>
                <button id="button_search">search</button>
                <button id="button_search_clear">clear</button>
                <label id="label_search_hit_count">0</label><label>hit</label>
            </div>
            <div id="div_bom_setting">
                <input id="checkbox_kikou" type="checkbox"><label>機構</label>
                <input id="checkbox_number" type="checkbox"><label>番号</label>
            </div>
            <br>
            <table id="table">
                <tr>
                    <td>Shift + ●クリック</td>
                    <td width="20" align="center">:</td>
                    <td>クリックした階層以下すべて開閉する</td>
                </tr>
                <tr>
                    <td>Ctrl + 要素文字列クリック</td>
                    <td width="20" align="center">:</td>
                    <td>要素の文字列コピー</td>
                </tr>
            </table>
            <br>
            <div id="path">
            </div>
            <div id="bom_top">
            </div>
        </div>
    </body>
    <script>

        let dirHandle = null;
        let bom_dir = null;
        let tif_entry = null;
        let tif_file_name = [];
        let file_entry = null;

        //-----------------------------------------------------------------------------------------------
        // ファンクション
        //-----------------------------------------------------------------------------------------------
        async function openDir() {
            dirHandle = await window.showDirectoryPicker();
            for await (let entry of dirHandle.values()) {
                if (entry.kind === "directory" && entry.name === "bom") {
                    bom_dir = entry;
                    document.getElementById("select_bom_file").innerHTML = "";
                    for await (const bom_entry of bom_dir.values()) {
                        if (bom_entry.kind === "file") {
                            const option = document.createElement("option");
                            option.value = bom_entry.name;
                            option.textContent = bom_entry.name;
                            document.getElementById("select_bom_file").appendChild(option);
                        }
                    }
                } else if (entry.kind === "directory" && entry.name === "tif") {
                    tif_entry = entry;
                    for await (let tif of tif_entry.values()) {
                        if (tif.kind === "file" && tif.name !== ".tif") {
                            tif_file_name.push(tif.name);
                        }
                    }
                }
            }
        }

        const make_element = async (text) => {
            //const lines = text.split(/\n/);
            const lines = text.split(/\r?\n/);
            let yoso_order = lines.shift().split(/,/);
            yoso_order.unshift("0");
            let hier = ["bom_top"];
            let number = 1;

            yoso_order.forEach((item, index) => {
                if (index === 0) return;
                let checkbox = document.createElement("input");
                checkbox.id = "yoso_" + index;
                checkbox.type = "checkbox";
                checkbox.checked = "true";
                document.getElementById("div_bom_setting").appendChild(checkbox);
                let label = document.createElement("label");
                label.textContent = "要素 " + index;
                document.getElementById("div_bom_setting").appendChild(label);
                let drop = document.createElement("option");
                drop.value = "yoso_" + index;
                drop.textContent = "要素 " + index;
                document.getElementById("select_search_target").appendChild(drop);
            });

            lines.forEach((line, index) => {
                let str = line.split(/\t/);

                let hier_number = Number(str[0]);
                let yoso = [];
                for (let i = 1; i < yoso_order.length; i++) {
                    yoso[i] = ["div", {className: "yoso yoso_" + i, textContent: str[yoso_order[i] - 1]}];
                }

                yoso.unshift(["div", {className: "yoso number hide_number", textContent: number}]);
                yoso.unshift(["div", {className: "op_cl", textContent: ""}]);

                hier[hier_number + 1] = number;
                hier_str = hier.slice(0, hier_number + 1).join("_");
                let p = document.getElementById(hier_str)
                let c_hier = document.createElement("div");
                c_hier.id = hier_str + "_" + number;
                c_hier.className = "hier";
                p.appendChild(c_hier);
                let c_hier_info = document.createElement("div");
                c_hier_info.className = "hier_info";
                c_hier.appendChild(c_hier_info);
                c_hier.classList.add("hide");
                if (hier_number === 0) {
                    c_hier.classList.add("hier_top");
                }

                // ------------------------------------------------------------------------------------------------------
                // BOM List用
                // ------------------------------------------------------------------------------------------------------
                    if (str[1].slice(1, 2) === "M") {
                       c_hier.classList.add("kikou");
                       c_hier.classList.add("hide_kikou");
                    }
                    yoso.push(["a", {className: "link_AA yoso", href: "", textContent: ""}]);
                    yoso.push(["a", {className: "link_SS yoso", href: "", textContent: ""}]);
                    yoso.push(["a", {className: "link_WW yoso", href: "", textContent: ""}]);
                    let object_number = str[1];
                    let object_number_cut = object_number.slice(2);
                    if (object_number.slice(0, 2) === "AA") {
                        if (tif_file_name.includes("SS" + object_number_cut + ".tif")) {
                            yoso[yoso_order.length + 3][1].href = "tif/" + "SS" + object_number_cut + ".tif";
                            yoso[yoso_order.length + 3][1].textContent = "tif(SS)";
                        }
                        if (tif_file_name.includes("WW" + object_number_cut + ".tif")) {
                            yoso[yoso_oder.length + 4][1].href = "tif/" + "WW" + object_number_cut + ".tif";
                            yoso[yoso_oder.length + 4][1].textContent = "tif(WW)";
                        }
                    }
                    if (tif_file_name.includes(object_number + ".tif")) {
                        yoso[yoso_order.length + 2][1].href = "tif/" + object_number + ".tif";
                        yoso[yoso_order.length + 2][1].textContent = "tif";
                    }
                // ------------------------------------------------------------------------------------------------------

                yoso.forEach((item) => {
                    let c_div = document.createElement(item[0]);
                    Object.assign(c_div, item[1]);
                    c_hier_info.appendChild(c_div);
                });
            
                number = number + 1;
            });

        }

        //-----------------------------------------------------------------------------------------------
        // イベント
        //-----------------------------------------------------------------------------------------------
        document.getElementById("button_bom_dir").addEventListener("click", async (e) => {
            openDir(e);
        });

        document.getElementById("div_bom_setting").addEventListener("change", (e) => {
            if (e.target.id === "checkbox_kikou") {
                document.querySelectorAll(".kikou").forEach((el) => {
                    el.classList.toggle("hide_kikou");
                })
            } else if (e.target.id === "checkbox_number") {
                document.querySelectorAll(".number").forEach((el) => {
                    el.classList.toggle("hide_number");
                })
            } else {
                document.querySelectorAll("." + e.target.id.replace("checkbox_", "")).forEach((el) => {
                    el.classList.toggle("off");
                })
            }
        });

        document.getElementById("bom_show").addEventListener(
            "click",
            async (e) => {
                const file_name = document.getElementById("select_bom_file").value;
                if (bom_dir) {
                    for await (const entry of bom_dir.values()) {
                        if (entry.kind === "file" && entry.name === file_name) {
                            file_entry = await entry;
                            const file = await entry.getFile();
                            await make_element(await file.text());
                        }
                    }
                }
            }
        );

        document.getElementById("file").addEventListener(
            "change",
            (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.readAsText(file);
                reader.onload = () => {
                    make_element(reader.result);
                };
            }
        );

        document.getElementById("button_bom_save").addEventListener(
            "click",
            async (e) => {
                //const fileHandle = await file_entry.getFileHandle("test.txt", { create: true });
                let line = "";
                document.getElementById("bom_top").querySelectorAll(".hier_info").forEach((el) => {
                    line = line + el.children[1].textContent + "\t" + el.children[2].textContent + "\n";
                });
                const writable = await file_entry.createWritable();
                //const writable = await fileHandle.createWritable();
                await writable.write(line);
                await writable.close();
            }
        );

        document.getElementById("bom_top").addEventListener(
            "click",
            (e) => {
                if(e.target.classList.contains("op_cl")) {
                    let state = "";
                    e.target.parentElement.parentElement.classList.toggle("hide");
                    if (e.shiftKey) {
                        e.target.parentElement.parentElement.querySelectorAll(".hier").forEach((el) => {
                            if (e.target.parentElement.parentElement.classList.contains("hide")) {
                                el.classList.add("hide");
                            } else {
                                el.classList.remove("hide");
                            }
                        });
                    }
                } else if (e.target.classList.contains("hier") && e.shiftKey) {
                    e.target.classList.toggle("hier_select"); 
                } else if (e.target.classList.contains("yoso") && e.ctrlKey) {
                    e.target.style.backgroundColor = "pink";
                    navigator.clipboard.writeText(e.target.textContent);
                    setTimeout(() => {
                        e.target.style.backgroundColor = "";
                    }, 300);
                } else if (e.target.classList.contains("yoso_2")) {
                    let path = e.target.textContent;
                    let parent = e.target.parentElement;
                    if (e.target.parentElement.parentElement.id !== "bom_top") {
                        parent = parent.parentElement.parentElement;
                        while (parent.id !== "bom_top") {
                            path = parent.querySelector(".yoso_2").textContent + "/" + path;
                            parent = parent.parentElement;
                        }
                    }
                    document.getElementById("path").textContent = "PATH : " + path;
                }
            }
        );

        document.getElementById("button_search").addEventListener(
            "click",
            (e) => {
                document.querySelectorAll(".search_hit").forEach((el) => {
                    el.classList.remove("search_hit");
                });
                let hit_count = 0
                let target = document.getElementById("select_search_target").value;
                document.querySelectorAll("." + target).forEach((el) => {
                    const search_word = document.getElementById("text_search_word").value;
                    if (el.textContent === search_word) {
                        hit_count = hit_count + 1;
                        el.parentElement.parentElement.classList.add("search_hit");
                    }
                });
                document.getElementById("label_search_hit_count").textContent = hit_count;
            }
        )

        document.getElementById("button_search_clear").addEventListener(
            "click",
            (e) => {
                document.querySelectorAll(".hier").forEach((el) => {
                    el.classList.remove("search_hit");
                });
                document.getElementById("label_search_hit_count").textContent = "0";
            }
        )

    </script>
</html>
