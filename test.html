<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        #div_open_close {
            width:fit-content;
            display:flex;
        }
        #div_search {
            width:fit-content;
            display:flex;
        }
        #top {
            box-sizing: border-box;
            border : solid 1px black;
            height: calc(100vh - 170px);
            overflow: scroll;
        }
        .display {
            padding: 5px 5px 5px 5px;
            box-sizing: border-box;
            display:flex;
            gap: 20px;
        }
        .hier {
            box-sizing: border-box;
            border : solid 1px black;
            margin: 5px 5px 5px 50px;
            padding: 5px 5px 5px 10px;
        }
    </style>
    <input id="file" type="file"></input>
    <br></br>
    <div id="div_open_close">
        <button id="all_open">all_open</button>
        <button id="all_close">all_close</button>
    </div>
    <div id="div_search">
        <input id="search_word" type="text"></input>
        <button id="search_button">search</button>
        <button id="search_clear">clear</button>
        <div id="hit_count">0</div>hit
    </div>

    <br></br>
    <div id="top">
    </div>
    
</body>

<script>

    const make_element = (text) => {
        const lines = text.split(/\n/);
        let hier = ["top"];
        lines.forEach((line, index) => {
            let str = line.split(/\s+/);
            //let val = ["[", str[0], ",", str[1], "]", str[2]];
            let val = [str[0], str[1], str[2]];
            hier[Number(str[1]) + 1] = str[0];
            hier_str = hier.slice(0, Number(str[1]) + 1).join("_");
            let p = document.getElementById(hier_str)
            let c_hier = document.createElement("div");
            c_hier.id = hier_str + "_" + str[0];
            c_hier.className = "hier";
            p.appendChild(c_hier);
            let c_open_close = document.createElement("div");
            c_open_close.className = "open_close";
            c_hier.appendChild(c_open_close);
            let c_display = document.createElement("div");
            c_display.className = "display";
            c_hier.appendChild(c_display);
            let c_number = document.createElement("div");
            c_number.className = "number";
            c_number.textContent = val[0];
            c_display.appendChild(c_number);
            let c_title = document.createElement("div");
            c_title.className = "title";
            c_title.textContent = val[2];
            c_display.appendChild(c_title);
        });
    }

    document.getElementById("file").addEventListener(
        "change",
        (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsText(file);
            reader.onload = () => {
                make_element(reader.result);
            };
        }
    );

    document.getElementById("top").addEventListener(
        "click",
        (e) => {
            if(e.target.classList.contains("title")) {
                e.target.parentElement.parentElement.querySelectorAll(":scope > .hier").forEach(el => {
                    if (el.style.display === "none") {
                        el.style.display = "block";
                    } else {
                        el.style.display = "none";
                    }
                });
            }
        }
    );

    document.getElementById("div_open_close").addEventListener(
        "click",
        (e) => {
            let val = "";
            if (e.target.id === "all_open") {
                val = "block";
            } else {
                val = "none";
            }
            document.querySelectorAll(".hier").forEach((el) => {
                if (el.parentElement.id === "top") {
                    el.style.display = "block";
                } else {
                    el.style.display = val;
                }
            });
        }
    )

    document.getElementById("search_button").addEventListener(
        "click",
        (e) => {
            let hit_count = 0
            document.querySelectorAll(".title").forEach((el) => {
                const search_word = document.getElementById("search_word").value;
                if (el.textContent === search_word) {
                    hit_count = hit_count + 1;
                    el.parentElement.parentElement.style.border = "solid 2px red";
                    let elp = el.parentElement;
                    while (elp.parentElement.id !== "top") {
                        //elp.parentElement.querySelector(":scope > .title").style.color = "red";
                        elp.parentElement.querySelector(":scope > .display").style.color = "red";
                        elp = elp.parentElement;
                    }
                }
            });
            document.getElementById("hit_count").textContent = hit_count;
        }
    )

    document.getElementById("search_clear").addEventListener(
        "click",
        (e) => {
            document.querySelectorAll(".title").forEach((el) => {
                el.parentElement.style.color = "black";
                el.parentElement.parentElement.style.removeProperty("border");
            });
            document.getElementById("hit_count").textContent = "0";
        }
    )

</script>
</html>
